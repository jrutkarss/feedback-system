services:
  db:
    image: postgres:15-alpine
    container_name: quickrate_db
    environment:
      POSTGRES_DB: quickratedb
      POSTGRES_USER: quickrateuser
      POSTGRES_PASSWORD: '011936'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: quickrate_web
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgres://quickrateuser:011936@db:5432/quickratedb
    depends_on:
      - db

volumes:
  postgres_data:
